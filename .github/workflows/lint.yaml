name: CI

on:
  push:
    branches: [main, dev/*]
  pull_request:
    branches: [main, dev/*]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint src/ test/ scripts/

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.js" "scripts/**/*.mjs" "test/**/*.js" "*.json" "*.yaml" ".github/**/*.yaml"

      - name: Run tests
        run: npm test

      # dist/ is generated and committed, because HACS reads it for anyone
      # tracking the branch instead of a release. A stale one ships old code.
      - name: Build
        run: npm run build

      - name: Check dist is up to date
        run: git diff --exit-code dist/

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
